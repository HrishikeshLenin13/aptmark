name: Core regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Regression contract
        run: npm test && npm run typecheck
      - name: Reference audit freshness and local evidence
        run: npm run compare:check
      - name: Report real history without inferring profile contributions
        run: npm run --silent development:status -- --markdown >> "$GITHUB_STEP_SUMMARY"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Install the tested browser and system dependencies
        run: npx playwright install chromium --with-deps
      - name: Verify the production build
        run: npm run build
      - name: Exercise the complete isolated browser regression suite
        run: npm run test:e2e
